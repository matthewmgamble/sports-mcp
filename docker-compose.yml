# Single-host deployment. Typical public setup: Cloudflare (TLS, DDoS) -> this host:8080.
#   cp .env.example .env   # set ADMIN_TOKEN, TRUSTED_PROXY_CIDRS, ...
#   docker compose up -d
# Self-hosting without Cloudflare? `docker compose --profile caddy up -d` adds Caddy for TLS.
services:
  sports-mcp:
    image: ghcr.io/matthewmgamble/sports-mcp:${SPORTS_MCP_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "8080"
      # Management (metrics/admin) stays reachable only from the host via the port mapping below.
      MGMT_BIND_HOST: 0.0.0.0
      MGMT_PORT: "9090"
      DB_PATH: /data/sports.db
      LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - sports-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 3s
      start_period: 20s

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPORTS_MCP_DOMAIN: ${SPORTS_MCP_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - sports-mcp

volumes:
  sports-data:
  caddy-data:
