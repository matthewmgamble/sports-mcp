name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format check
        run: ./mvnw -B -q spotless:check
      - name: Build and test
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push until Sprint 5)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sports-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
